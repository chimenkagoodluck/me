<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1200">
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;1,400&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet">
<title>og-cover</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    width: 1200px;
    height: 630px;
    overflow: hidden;
    background: #FAF7F2;
    font-family: 'DM Sans', sans-serif;
    display: flex;
    align-items: stretch;
    position: relative;
  }

  /* ── warm ambient ── */
  body::before {
    content: '';
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse 50% 80% at 0% 50%, rgba(196,104,79,0.07) 0%, transparent 55%),
      radial-gradient(ellipse 45% 55% at 100% 0%, rgba(78,96,64,0.05) 0%, transparent 50%);
    pointer-events: none;
    z-index: 0;
  }

  /* ── corner marks ── */
  .corner {
    position: absolute;
    width: 22px;
    height: 22px;
    border-color: rgba(196,104,79,0.35);
    border-style: solid;
    z-index: 2;
  }
  .corner.tl { top: 26px; left: 26px; border-width: 2px 0 0 2px; }
  .corner.tr { top: 26px; right: 26px; border-width: 2px 2px 0 0; }
  .corner.bl { bottom: 26px; left: 26px; border-width: 0 0 2px 2px; }
  .corner.br { bottom: 26px; right: 26px; border-width: 0 2px 2px 0; }

  /* ── left accent bar ── */
  .accent-bar {
    position: absolute;
    left: 60px;
    top: 50%;
    transform: translateY(-50%);
    width: 3px;
    height: 200px;
    background: linear-gradient(to bottom, transparent, #C4684F 25%, #C4684F 75%, transparent);
    border-radius: 2px;
    z-index: 1;
  }

  /* ══ LEFT PANEL ══ */
  .left {
    position: relative;
    z-index: 1;
    flex: 0 0 580px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 52px 52px 52px 90px;
  }

  .eyebrow {
    font-size: 10.5px;
    font-weight: 500;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: #C4684F;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .eyebrow::before {
    content: '';
    display: inline-block;
    width: 16px;
    height: 1px;
    background: #C4684F;
  }

  .name {
    font-family: 'Lora', serif;
    font-size: 60px;
    font-weight: 600;
    line-height: 1.06;
    color: #1A1815;
    letter-spacing: -0.015em;
    margin-bottom: 18px;
  }
  .name em {
    font-style: italic;
    color: #C4684F;
  }

  .divider {
    width: 40px;
    height: 2px;
    background: rgba(196,104,79,0.45);
    margin-bottom: 18px;
  }

  .roles {
    display: flex;
    flex-direction: column;
    gap: 4px;
    margin-bottom: 28px;
  }
  .role-line {
    font-size: 15px;
    font-weight: 300;
    color: rgba(26,24,21,0.5);
    letter-spacing: 0.01em;
  }
  .role-line strong {
    font-weight: 500;
    color: rgba(26,24,21,0.8);
  }

  /* ── contact row ── */
  .contact-row {
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin-bottom: 26px;
  }
  .contact-item {
    font-size: 12.5px;
    font-weight: 400;
    color: rgba(26,24,21,0.5);
    letter-spacing: 0.02em;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .contact-item .dot {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: #C4684F;
    opacity: 0.7;
    flex-shrink: 0;
  }

  /* ── available badge ── */
  .avail {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    background: rgba(78,96,64,0.1);
    border: 1px solid rgba(78,96,64,0.25);
    border-radius: 20px;
    padding: 6px 14px;
    font-size: 11px;
    font-weight: 500;
    color: #4E6040;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    width: fit-content;
  }
  .avail-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #4E6040;
    box-shadow: 0 0 0 3px rgba(78,96,64,0.18);
  }

  /* ══ RIGHT PANEL ══ */
  .right {
    position: relative;
    z-index: 1;
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 0;
    padding: 32px 40px 32px 32px;
    background: rgba(239,232,220,0.45);
  }

  /* vertical separator */
  .right::before {
    content: '';
    position: absolute;
    left: 0;
    top: 12%;
    height: 76%;
    width: 1px;
    background: linear-gradient(to bottom, transparent, rgba(196,104,79,0.15) 40%, rgba(196,104,79,0.15) 60%, transparent);
  }

  /* ── photo ── */
  .photo-wrap {
    position: relative;
    width: 240px;
    height: 280px;
    flex-shrink: 0;
    margin-bottom: 20px;
  }

  .photo-wrap::before {
    content: '';
    position: absolute;
    inset: -16px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(196,104,79,0.1) 0%, transparent 70%);
  }

  .photo-wrap img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center top;
    border-radius: 120px 120px 90px 90px;
    display: block;
    position: relative;
    z-index: 1;
  }

  .photo-ring {
    position: absolute;
    inset: -4px;
    border-radius: 124px 124px 94px 94px;
    border: 1.5px solid rgba(196,104,79,0.3);
    z-index: 2;
  }

  .location-chip {
    position: absolute;
    bottom: -14px;
    left: 50%;
    transform: translateX(-50%);
    background: #FAF7F2;
    border: 1px solid rgba(196,104,79,0.2);
    border-radius: 20px;
    padding: 4px 12px;
    font-size: 10.5px;
    font-weight: 400;
    color: rgba(26,24,21,0.45);
    white-space: nowrap;
    z-index: 3;
    letter-spacing: 0.04em;
  }

  /* ── quote ── */
  .quote-block {
    border-left: 2px solid rgba(196,104,79,0.4);
    padding-left: 14px;
    margin-top: 8px;
    max-width: 310px;
    align-self: flex-start;
    margin-left: 20px;
  }
  .quote-text {
    font-family: 'Lora', serif;
    font-style: italic;
    font-size: 12.5px;
    line-height: 1.65;
    color: rgba(26,24,21,0.52);
  }
  .quote-attr {
    margin-top: 6px;
    font-size: 10.5px;
    font-weight: 500;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: rgba(196,104,79,0.7);
  }
</style>
</head>
<body>

  <div class="corner tl"></div>
  <div class="corner tr"></div>
  <div class="corner bl"></div>
  <div class="corner br"></div>
  <div class="accent-bar"></div>

  <!-- LEFT -->
  <div class="left">
    <div class="eyebrow">Portfolio</div>

    <div class="name">Chimenka<br><em>Goodluck</em></div>

    <div class="divider"></div>

    <div class="roles">
      <div class="role-line"><strong>Software Engineer</strong> &amp; AI Researcher</div>
      <div class="role-line"><strong>Cybersecurity</strong> Specialist</div>
    </div>

    <div class="contact-row">
      <div class="contact-item"><span class="dot"></span>chimenkagoodluck@gmail.com</div>
      <div class="contact-item"><span class="dot"></span>09035044862</div>
    </div>

    <div class="avail">
      <span class="avail-dot"></span>
      Available
    </div>
  </div>

  <!-- RIGHT -->
  <div class="right">
    <div class="photo-wrap">
      <img src="images/WhatsApp Image 2026-04-06 at 9.27.58 PM.jpeg" alt="Chimenka Goodluck">
      <div class="photo-ring"></div>
      <div class="location-chip">◎ Lagos, Nigeria</div>
    </div>

    <div class="quote-block">
      <div class="quote-text">"The computer age is for you, not you for the computer age..."</div>
      <div class="quote-attr">— Chimenka Goodluck</div>
    </div>
  </div>

</body>
</html>
